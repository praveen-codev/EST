[versions]
java = "25"
springBoot = "4.1.1"
springdoc = "3.1.1"
googleCalendar = "v3-rev20260925-2.0.0"
googleAuth = "1.54.0"
googleApiClient = "2.8.1"
bucket4j = "8.14.0"
archunit = "1.4.1"
spotless = "7.2.1"

[libraries]
# Spring Boot 4 starters (modular names; see Boot 4.0 migration guide)
boot-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
boot-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
boot-security = { module = "org.springframework.boot:spring-boot-starter-security" }
boot-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-security-oauth2-resource-server" }
boot-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
boot-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
boot-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
boot-restclient = { module = "org.springframework.boot:spring-boot-starter-restclient" }
boot-jackson = { module = "org.springframework.boot:spring-boot-starter-jackson" }
boot-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
boot-security-test = { module = "org.springframework.boot:spring-boot-starter-security-test" }
boot-data-jpa-test = { module = "org.springframework.boot:spring-boot-starter-data-jpa-test" }
boot-flyway-test = { module = "org.springframework.boot:spring-boot-starter-flyway-test" }
boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor" }

flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
h2 = { module = "com.h2database:h2" }
postgresql = { module = "org.postgresql:postgresql" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter" }

springdoc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
google-calendar = { module = "com.google.apis:google-api-services-calendar", version.ref = "googleCalendar" }
google-auth = { module = "com.google.auth:google-auth-library-oauth2-http", version.ref = "googleAuth" }
google-api-client = { module = "com.google.api-client:google-api-client", version.ref = "googleApiClient" }
bucket4j = { module = "com.bucket4j:bucket4j_jdk17-core", version.ref = "bucket4j" }
archunit = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
