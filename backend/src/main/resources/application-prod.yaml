# Production: everything from the environment, strict defaults. See infra/runbooks/deploy-gcp-supabase.html.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${EST_DB_POOL_SIZE:5}
      connection-timeout: 10000
      max-lifetime: 1500000
server:
  forward-headers-strategy: native
management:
  endpoint:
    health:
      show-details: never
logging:
  structured:
    format:
      console: ecs
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
